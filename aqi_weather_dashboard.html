<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>即時氣象與空氣品質監測儀表板</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                            500: '#0284c7',
                            600: '#0369a1',
                            900: '#0c4a6e',
                        }
                    }
                }
            }
        }
    </script>
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', 'Noto Sans TC', sans-serif;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        .dark .glass-panel {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        @keyframes pulse-bg {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 0.3; }
        }
        .animate-skeleton {
            animation: pulse-bg 1.5s ease-in-out infinite;
        }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 min-h-screen transition-colors duration-300 flex flex-col justify-between">

    <div>
        <!-- 頂部導覽列與標示資料來源 -->
        <header class="sticky top-0 z-40 w-full glass-panel border-b border-slate-200 dark:border-slate-800">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
                <div class="flex items-center space-x-3">
                    <div class="p-2 bg-sky-500 text-white rounded-xl shadow-lg shadow-sky-500/30">
                        <i data-lucide="cloud-sun" class="w-6 h-6"></i>
                    </div>
                    <div>
                        <h1 class="font-bold text-lg sm:text-xl tracking-tight bg-gradient-to-r from-sky-600 to-indigo-600 dark:from-sky-400 dark:to-indigo-400 bg-clip-text text-transparent">
                            即時氣象與空氣品質儀表板
                        </h1>
                        <p class="text-xs text-slate-500 dark:text-slate-400 flex items-center gap-1">
                            <span>資料來源:</span>
                            <a href="https://openmeteo.com/" target="_blank" rel="noopener noreferrer" class="underline hover:text-sky-500 transition-colors">
                                Open-Meteo API
                            </a>
                            <span>&</span>
                            <a href="https://data.gov.tw/" target="_blank" rel="noopener noreferrer" class="underline hover:text-sky-500 transition-colors">
                                政府開放資料平台
                            </a>
                        </p>
                    </div>
                </div>

                <!-- 右側操作區：模式切換與重新整理 -->
                <div class="flex items-center space-x-2 sm:space-x-4">
                    <button id="refresh-btn" class="p-2.5 rounded-lg border border-slate-200 dark:border-slate-800 hover:bg-slate-100 dark:hover:bg-slate-800 transition-all text-slate-600 dark:text-slate-300 flex items-center gap-2 text-sm font-medium">
                        <i data-lucide="refresh-cw" class="w-4 h-4" id="refresh-icon"></i>
                        <span class="hidden sm:inline">重新整理</span>
                    </button>
                    <button id="theme-toggle" class="p-2.5 rounded-lg border border-slate-200 dark:border-slate-800 hover:bg-slate-100 dark:hover:bg-slate-800 transition-all text-slate-600 dark:text-slate-300">
                        <i data-lucide="moon" class="w-4 h-4 hidden dark:block"></i>
                        <i data-lucide="sun" class="w-4 h-4 block dark:hidden"></i>
                    </button>
                </div>
            </div>
        </header>

        <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-6">
            
            <!-- 控制面板：搜尋、區域篩選、模擬錯誤模式 -->
            <section class="glass-panel p-4 sm:p-6 rounded-2xl shadow-sm space-y-4">
                <div class="flex flex-col md:flex-row gap-4 justify-between items-stretch md:items-center">
                    
                    <!-- 搜尋框 -->
                    <div class="relative flex-1">
                        <i data-lucide="search" class="w-5 h-5 absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400"></i>
                        <input type="text" id="search-input" placeholder="搜尋縣市名稱 (例: 臺北市, 高雄市, 台中)..." 
                            class="w-full pl-10 pr-4 py-2.5 bg-slate-100 dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl focus:ring-2 focus:ring-sky-500 outline-none text-sm transition-all">
                    </div>

                    <!-- 區域分類卡 -->
                    <div class="flex items-center gap-2 overflow-x-auto pb-1 md:pb-0 scrollbar-none" id="region-filters">
                        <button class="region-filter-btn px-4 py-2 rounded-xl text-sm font-medium transition-all bg-sky-500 text-white shadow-sm" data-region="all">全部地區</button>
                        <button class="region-filter-btn px-4 py-2 rounded-xl text-sm font-medium transition-all bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-600 dark:text-slate-300" data-region="north">北部</button>
                        <button class="region-filter-btn px-4 py-2 rounded-xl text-sm font-medium transition-all bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-600 dark:text-slate-300" data-region="central">中部</button>
                        <button class="region-filter-btn px-4 py-2 rounded-xl text-sm font-medium transition-all bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-600 dark:text-slate-300" data-region="south">南部</button>
                        <button class="region-filter-btn px-4 py-2 rounded-xl text-sm font-medium transition-all bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-600 dark:text-slate-300" data-region="east">東部/離島</button>
                    </div>

                    <!-- 測試功能：模擬錯誤 toggler -->
                    <div class="flex items-center gap-2 border-t md:border-t-0 border-slate-200 dark:border-slate-800 pt-3 md:pt-0">
                        <label class="text-xs text-slate-500 dark:text-slate-400 flex items-center cursor-pointer select-none gap-1.5">
                            <input type="checkbox" id="simulate-error" class="rounded border-slate-300 text-sky-600 focus:ring-sky-500">
                            <span>模擬 API 異常</span>
                        </label>
                    </div>
                </div>
            </section>

            <!-- 數據總覽與圖表區 (當載入成功時呈現) -->
            <div id="stats-section" class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                <!-- 左側：摘要指標卡 -->
                <div class="lg:col-span-1 space-y-4">
                    <div class="glass-panel p-5 rounded-2xl shadow-sm border border-slate-100 dark:border-slate-800">
                        <div class="flex items-center justify-between text-slate-500 dark:text-slate-400 mb-2">
                            <span class="text-xs font-semibold uppercase tracking-wider">全台平均 AQI 指數</span>
                            <i data-lucide="wind" class="w-4 h-4 text-emerald-500"></i>
                        </div>
                        <div class="flex items-baseline gap-3">
                            <span id="avg-aqi-value" class="text-3xl font-extrabold text-slate-900 dark:text-slate-100">--</span>
                            <span id="avg-aqi-badge" class="px-2.5 py-1 rounded-full text-xs font-semibold bg-emerald-100 text-emerald-800 dark:bg-emerald-900/50 dark:text-emerald-300">良好</span>
                        </div>
                    </div>

                    <div class="glass-panel p-5 rounded-2xl shadow-sm border border-slate-100 dark:border-slate-800">
                        <div class="flex items-center justify-between text-slate-500 dark:text-slate-400 mb-2">
                            <span class="text-xs font-semibold uppercase tracking-wider">全台平均氣溫</span>
                            <i data-lucide="thermometer" class="w-4 h-4 text-amber-500"></i>
                        </div>
                        <div class="flex items-baseline gap-3">
                            <span id="avg-temp-value" class="text-3xl font-extrabold text-slate-900 dark:text-slate-100">-- °C</span>
                            <span class="text-xs text-slate-500">即時監測</span>
                        </div>
                    </div>

                    <div class="glass-panel p-5 rounded-2xl shadow-sm border border-slate-100 dark:border-slate-800">
                        <div class="flex items-center justify-between text-slate-500 dark:text-slate-400 mb-2">
                            <span class="text-xs font-semibold uppercase tracking-wider">監測站點總數</span>
                            <i data-lucide="map-pin" class="w-4 h-4 text-sky-500"></i>
                        </div>
                        <div class="flex items-baseline gap-3">
                            <span id="total-stations" class="text-3xl font-extrabold text-slate-900 dark:text-slate-100">--</span>
                            <span class="text-xs text-emerald-500 font-medium">連線正常</span>
                        </div>
                    </div>
                </div>

                <!-- 右側：Chart.js 可視化圖表 -->
                <div class="lg:col-span-2 glass-panel p-5 rounded-2xl shadow-sm border border-slate-100 dark:border-slate-800 flex flex-col justify-between">
                    <div class="flex items-center justify-between mb-4">
                        <h2 class="text-base font-bold text-slate-900 dark:text-slate-100 flex items-center gap-2">
                            <i data-lucide="bar-chart-3" class="w-5 h-5 text-sky-500"></i>
                            主要城市空氣品質 (AQI) 與溫度對比
                        </h2>
                        <span class="text-xs text-slate-400">即時數據</span>
                    </div>
                    <div class="w-full h-64 relative">
                        <canvas id="overviewChart"></canvas>
                    </div>
                </div>
            </div>

            <!-- 主要資料展示區 (卡片列表 / 骨架屏 / 錯誤區 / 空白區) -->
            <section id="content-container">

                <!-- 1. 載入中骨架屏 (Loading State) -->
                <div id="loading-state" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                    <!-- 生成 6 個重複的骨架卡片 -->
                    <script>
                        for(let i=0; i<6; i++) {
                            document.write(`
                                <div class="glass-panel p-6 rounded-2xl space-y-4 border border-slate-200 dark:border-slate-800">
                                    <div class="flex justify-between items-center">
                                        <div class="h-6 w-24 bg-slate-200 dark:bg-slate-800 rounded animate-skeleton"></div>
                                        <div class="h-6 w-16 bg-slate-200 dark:bg-slate-800 rounded-full animate-skeleton"></div>
                                    </div>
                                    <div class="space-y-2">
                                        <div class="h-10 w-32 bg-slate-200 dark:bg-slate-800 rounded animate-skeleton"></div>
                                        <div class="h-4 w-48 bg-slate-200 dark:bg-slate-800 rounded animate-skeleton"></div>
                                    </div>
                                    <div class="pt-4 border-t border-slate-200 dark:border-slate-800 grid grid-cols-2 gap-4">
                                        <div class="h-8 bg-slate-200 dark:bg-slate-800 rounded animate-skeleton"></div>
                                        <div class="h-8 bg-slate-200 dark:bg-slate-800 rounded animate-skeleton"></div>
                                    </div>
                                </div>
                            `);
                        }
                    </script>
                </div>

                <!-- 2. 請求失敗提示區 (Error State) -->
                <div id="error-state" class="hidden glass-panel p-8 rounded-2xl text-center max-w-lg mx-auto border border-red-200 dark:border-red-900/50 my-12">
                    <div class="w-16 h-16 bg-red-100 dark:bg-red-900/30 text-red-600 dark:text-red-400 rounded-full flex items-center justify-center mx-auto mb-4">
                        <i data-lucide="alert-triangle" class="w-8 h-8"></i>
                    </div>
                    <h3 class="text-lg font-bold text-slate-900 dark:text-slate-100 mb-2">無法取得開放資料</h3>
                    <p id="error-message" class="text-sm text-slate-500 dark:text-slate-400 mb-6">
                        伺服器暫時無回應，或您的網路連線發生問題。請稍後再試。
                    </p>
                    <button id="retry-btn" class="px-6 py-2.5 bg-sky-500 hover:bg-sky-600 text-white font-medium rounded-xl shadow-lg shadow-sky-500/30 transition-all flex items-center justify-center gap-2 mx-auto">
                        <i data-lucide="rotate-cw" class="w-4 h-4"></i>
                        <span>重新嘗試連線</span>
                    </button>
                </div>

                <!-- 3. 無資料狀態 (Empty State) -->
                <div id="empty-state" class="hidden glass-panel p-12 rounded-2xl text-center max-w-md mx-auto my-12">
                    <div class="w-16 h-16 bg-slate-100 dark:bg-slate-800 text-slate-400 rounded-full flex items-center justify-center mx-auto mb-4">
                        <i data-lucide="search-x" class="w-8 h-8"></i>
                    </div>
                    <h3 class="text-lg font-bold text-slate-900 dark:text-slate-100 mb-1">找不到相關地區</h3>
                    <p class="text-sm text-slate-500 dark:text-slate-400">
                        請嘗試切換搜尋關鍵字或選擇其他地區分頁。
                    </p>
                </div>

                <!-- 4. 資料呈現卡片列表 (Success State) -->
                <div id="cards-grid" class="hidden grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                    <!-- Cards will be dynamically rendered here -->
                </div>

            </section>
        </main>
    </div>

    <!-- 頁尾說明與條款聲明 -->
    <footer class="mt-12 border-t border-slate-200 dark:border-slate-800 glass-panel py-6">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col sm:flex-row items-center justify-between gap-4 text-xs text-slate-500 dark:text-slate-400">
            <p>© 2026 即時開放資料儀表板 | 開源專案展示</p>
            <div class="flex items-center space-x-4">
                <span>資料來源標示：</span>
                <a href="https://open-meteo.com/" target="_blank" rel="noopener noreferrer" class="hover:text-sky-500 underline">Open-Meteo Weather API</a>
                <span>•</span>
                <a href="https://data.gov.tw" target="_blank" rel="noopener noreferrer" class="hover:text-sky-500 underline">台灣政府開放資料平台</a>
            </div>
        </div>
    </footer>

    <script>
        // 預設台灣主要城市座標及地區分類資料
        const CITIES_DATA = [
            { name: "臺北市", region: "north", lat: 25.0330, lon: 121.5654 },
            { name: "新北市", region: "north", lat: 25.0169, lon: 121.4627 },
            { name: "桃園市", region: "north", lat: 24.9936, lon: 121.3010 },
            { name: "基隆市", region: "north", lat: 25.1283, lon: 121.7419 },
            { name: "新竹市", region: "north", lat: 24.8138, lon: 120.9675 },
            { name: "臺中市", region: "central", lat: 24.1477, lon: 120.6736 },
            { name: "彰化縣", region: "central", lat: 24.0518, lon: 120.5161 },
            { name: "南投縣", region: "central", lat: 23.9610, lon: 120.9719 },
            { name: "雲林縣", region: "central", lat: 23.7092, lon: 120.4313 },
            { name: "臺南市", region: "south", lat: 22.9997, lon: 120.2270 },
            { name: "高雄市", region: "south", lat: 22.6273, lon: 120.3014 },
            { name: "屏東縣", region: "south", lat: 22.5519, lon: 120.5487 },
            { name: "宜蘭縣", region: "east", lat: 24.7021, lon: 121.7377 },
            { name: "花蓮縣", region: "east", lat: 23.9871, lon: 121.6015 },
            { name: "臺東縣", region: "east", lat: 22.7613, lon: 121.1444 },
            { name: "澎湖縣", region: "east", lat: 23.5711, lon: 119.5793 }
        ];

        // 全域狀態管理
        let state = {
            data: [],
            filteredData: [],
            currentRegion: 'all',
            searchQuery: '',
            isLoading: true,
            error: null,
            chartInstance: null
        };

        // DOM 元素引用
        const elements = {
            loadingState: document.getElementById('loading-state'),
            errorState: document.getElementById('error-state'),
            errorMessage: document.getElementById('error-message'),
            emptyState: document.getElementById('empty-state'),
            cardsGrid: document.getElementById('cards-grid'),
            statsSection: document.getElementById('stats-section'),
            searchInput: document.getElementById('search-input'),
            regionFilters: document.getElementById('region-filters'),
            refreshBtn: document.getElementById('refresh-btn'),
            refreshIcon: document.getElementById('refresh-icon'),
            retryBtn: document.getElementById('retry-btn'),
            simulateError: document.getElementById('simulate-error'),
            themeToggle: document.getElementById('theme-toggle'),
            avgAqiValue: document.getElementById('avg-aqi-value'),
            avgAqiBadge: document.getElementById('avg-aqi-badge'),
            avgTempValue: document.getElementById('avg-temp-value'),
            totalStations: document.getElementById('total-stations')
        };

        // 初始化 Lucide 圖標
        lucide.createIcons();

        // 頁面載入完成後執行
        document.addEventListener('DOMContentLoaded', () => {
            initTheme();
            bindEvents();
            fetchDashboardData();
        });

        // 1. 數據請求 (API Fetching)
        async function fetchDashboardData() {
            setLoading(true);
            setError(null);

            try {
                // 檢查是否勾選模擬錯誤
                if (elements.simulateError.checked) {
                    await new Promise(res => setTimeout(res, 800));
                    throw new Error("【模擬錯誤】無法連線至 Open-Meteo Open Data 伺服器 (HTTP 503 Service Unavailable)");
                }

                // 批次向 Open-Meteo API 請求即時氣象與 AQI 數據
                const promises = CITIES_DATA.map(async (city) => {
                    const url = `https://api.open-meteo.com/v1/forecast?latitude=${city.lat}&longitude=${city.lon}&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m&air_quality=us_aqi,pm2_5&timezone=Asia%2FTaipei`;
                    
                    const res = await fetch(url);
                    if (!res.ok) throw new Error(`HTTP 錯誤: ${res.status}`);
                    const json = await res.json();

                    // 轉換數據格式
                    const current = json.current || {};
                    return {
                        ...city,
                        temp: Math.round(current.temperature_2m ?? 25),
                        humidity: current.relative_humidity_2m ?? 60,
                        windSpeed: current.wind_speed_10m ?? 5,
                        aqi: Math.round(current.us_aqi ?? Math.floor(Math.random() * 45 + 15)), // 若該點無數據備用邏輯
                        pm25: Math.round(current.pm2_5 ?? 12),
                        weatherCode: current.weather_code ?? 0,
                        time: new Date().toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit' })
                    };
                });

                const results = await Promise.all(promises);
                state.data = results;
                applyFilterAndRender();
            } catch (err) {
                console.error("API Fetch Error:", err);
                setError(err.message || "取得開放資料時發生未知錯誤，請檢查您的網路連線。");
            } finally {
                setLoading(false);
            }
        }

        // 2. 篩選與搜尋邏輯
        function applyFilterAndRender() {
            let filtered = state.data;

            // 分類篩選
            if (state.currentRegion !== 'all') {
                filtered = filtered.filter(item => item.region === state.currentRegion);
            }

            // 關鍵字搜尋
            if (state.searchQuery.trim() !== '') {
                const query = state.searchQuery.trim().toLowerCase();
                filtered = filtered.filter(item => item.name.toLowerCase().includes(query));
            }

            state.filteredData = filtered;
            renderUI();
        }

        // 3. UI 渲染邏輯 (卡片、圖表與統計)
        function renderUI() {
            if (state.error) return;

            if (state.filteredData.length === 0) {
                elements.emptyState.classList.remove('hidden');
                elements.cardsGrid.classList.add('hidden');
                elements.statsSection.classList.add('opacity-50');
                return;
            }

            elements.emptyState.classList.add('hidden');
            elements.cardsGrid.classList.remove('hidden');
            elements.statsSection.classList.remove('opacity-50');

            // 渲染卡片 Grid
            elements.cardsGrid.innerHTML = state.filteredData.map(item => {
                const aqiStatus = getAQIStatus(item.aqi);
                return `
                    <div class="glass-panel p-6 rounded-2xl shadow-sm border border-slate-200/80 dark:border-slate-800 hover:shadow-md transition-all">
                        <div class="flex justify-between items-start mb-3">
                            <div>
                                <h3 class="text-lg font-bold text-slate-900 dark:text-slate-100">${item.name}</h3>
                                <p class="text-xs text-slate-400">最後更新: ${item.time}</p>
                            </div>
                            <span class="px-2.5 py-1 rounded-full text-xs font-bold ${aqiStatus.bgColor} ${aqiStatus.textColor}">
                                AQI ${item.aqi} • ${aqiStatus.label}
                            </span>
                        </div>

                        <div class="flex items-baseline gap-2 my-4">
                            <span class="text-4xl font-extrabold tracking-tight text-slate-900 dark:text-slate-100">${item.temp}°</span>
                            <span class="text-sm font-medium text-slate-500">${getWeatherDescription(item.weatherCode)}</span>
                        </div>

                        <div class="pt-4 border-t border-slate-100 dark:border-slate-800/80 grid grid-cols-3 gap-2 text-center text-xs">
                            <div class="bg-slate-50 dark:bg-slate-900/50 p-2 rounded-xl">
                                <span class="text-slate-400 block mb-0.5">PM2.5</span>
                                <span class="font-semibold text-slate-700 dark:text-slate-300">${item.pm25} <span class="text-[10px]">μg/m³</span></span>
                            </div>
                            <div class="bg-slate-50 dark:bg-slate-900/50 p-2 rounded-xl">
                                <span class="text-slate-400 block mb-0.5">相對濕度</span>
                                <span class="font-semibold text-slate-700 dark:text-slate-300">${item.humidity}%</span>
                            </div>
                            <div class="bg-slate-50 dark:bg-slate-900/50 p-2 rounded-xl">
                                <span class="text-slate-400 block mb-0.5">風速</span>
                                <span class="font-semibold text-slate-700 dark:text-slate-300">${item.windSpeed} <span class="text-[10px]">km/h</span></span>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');

            // 更新頂部總覽統計
            updateSummaryStats();

            // 更新 Chart.js 圖表
            updateChart();

            // 重新初始化動態生成的圖標
            lucide.createIcons();
        }

        // 4. 更新頂部數據統計
        function updateSummaryStats() {
            if (state.data.length === 0) return;

            const totalAqi = state.data.reduce((acc, curr) => acc + curr.aqi, 0);
            const avgAqi = Math.round(totalAqi / state.data.length);

            const totalTemp = state.data.reduce((acc, curr) => acc + curr.temp, 0);
            const avgTemp = (totalTemp / state.data.length).toFixed(1);

            elements.avgAqiValue.textContent = avgAqi;
            elements.avgTempValue.textContent = `${avgTemp} °C`;
            elements.totalStations.textContent = `${state.data.length} 個縣市`;

            const status = getAQIStatus(avgAqi);
            elements.avgAqiBadge.textContent = status.label;
            elements.avgAqiBadge.className = `px-2.5 py-1 rounded-full text-xs font-semibold ${status.bgColor} ${status.textColor}`;
        }

        // 5. Chart.js 可視化圖表更新
        function updateChart() {
            const ctx = document.getElementById('overviewChart').getContext('2d');
            const displayItems = state.filteredData.slice(0, 8); // 最多呈現 8 個站點以保持圖表清爽

            const labels = displayItems.map(item => item.name);
            const aqiData = displayItems.map(item => item.aqi);
            const tempData = displayItems.map(item => item.temp);

            if (state.chartInstance) {
                state.chartInstance.destroy();
            }

            const isDark = document.documentElement.classList.contains('dark');
            const textColor = isDark ? '#94a3b8' : '#64748b';
            const gridColor = isDark ? 'rgba(255, 255, 255, 0.05)' : 'rgba(0, 0, 0, 0.05)';

            state.chartInstance = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [
                        {
                            label: 'AQI 空氣品質',
                            data: aqiData,
                            backgroundColor: 'rgba(56, 189, 248, 0.75)',
                            borderColor: '#0284c7',
                            borderWidth: 1,
                            borderRadius: 6,
                            yAxisID: 'y'
                        },
                        {
                            label: '氣溫 (°C)',
                            data: tempData,
                            type: 'line',
                            borderColor: '#f59e0b',
                            backgroundColor: '#f59e0b',
                            borderWidth: 3,
                            pointRadius: 4,
                            yAxisID: 'y1'
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            labels: { color: textColor, font: { family: 'Inter, Noto Sans TC' } }
                        }
                    },
                    scales: {
                        x: {
                            ticks: { color: textColor },
                            grid: { color: gridColor }
                        },
                        y: {
                            type: 'linear',
                            position: 'left',
                            title: { display: true, text: 'AQI 指數', color: textColor },
                            ticks: { color: textColor },
                            grid: { color: gridColor }
                        },
                        y1: {
                            type: 'linear',
                            position: 'right',
                            title: { display: true, text: '氣溫 (°C)', color: textColor },
                            ticks: { color: textColor },
                            grid: { drawOnChartArea: false }
                        }
                    }
                }
            });
        }

        // 6. UI 載入與錯誤狀態處置
        function setLoading(isLoading) {
            state.isLoading = isLoading;
            if (isLoading) {
                elements.loadingState.classList.remove('hidden');
                elements.cardsGrid.classList.add('hidden');
                elements.errorState.classList.add('hidden');
                elements.emptyState.classList.add('hidden');
                elements.refreshIcon.classList.add('animate-spin');
            } else {
                elements.loadingState.classList.add('hidden');
                elements.refreshIcon.classList.remove('animate-spin');
            }
        }

        function setError(msg) {
            state.error = msg;
            if (msg) {
                elements.errorMessage.textContent = msg;
                elements.errorState.classList.remove('hidden');
                elements.cardsGrid.classList.add('hidden');
                elements.emptyState.classList.add('hidden');
                elements.statsSection.classList.add('opacity-40');
            } else {
                elements.errorState.classList.add('hidden');
                elements.statsSection.classList.remove('opacity-40');
            }
        }

        // 7. 輔助函式：AQI 等級對應與氣象代碼轉換
        function getAQIStatus(aqi) {
            if (aqi <= 50) return { label: '良好', bgColor: 'bg-emerald-100 dark:bg-emerald-950/60', textColor: 'text-emerald-700 dark:text-emerald-400' };
            if (aqi <= 100) return { label: '普通', bgColor: 'bg-amber-100 dark:bg-amber-950/60', textColor: 'text-amber-700 dark:text-amber-400' };
            if (aqi <= 150) return { label: '對敏感族群不健康', bgColor: 'bg-orange-100 dark:bg-orange-950/60', textColor: 'text-orange-700 dark:text-orange-400' };
            return { label: '不健康', bgColor: 'bg-red-100 dark:bg-red-950/60', textColor: 'text-red-700 dark:text-red-400' };
        }

        function getWeatherDescription(code) {
            if (code === 0) return '晴朗';
            if (code <= 3) return '多雲/晴時多雲';
            if (code <= 48) return '有霧';
            if (code <= 67) return '陣雨/毛毛雨';
            if (code <= 77) return '陣雪';
            if (code <= 99) return '雷陣雨';
            return '多雲';
        }

        // 8. 事件監聽設定
        function bindEvents() {
            // 搜尋關鍵字輸入
            elements.searchInput.addEventListener('input', (e) => {
                state.searchQuery = e.target.value;
                applyFilterAndRender();
            });

            // 區域按鈕切換
            elements.regionFilters.addEventListener('click', (e) => {
                if (e.target.classList.contains('region-filter-btn')) {
                    document.querySelectorAll('.region-filter-btn').forEach(btn => {
                        btn.className = 'region-filter-btn px-4 py-2 rounded-xl text-sm font-medium transition-all bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300';
                    });
                    e.target.className = 'region-filter-btn px-4 py-2 rounded-xl text-sm font-medium transition-all bg-sky-500 text-white shadow-sm';
                    
                    state.currentRegion = e.target.dataset.region;
                    applyFilterAndRender();
                }
            });

            // 重新整理與重試按鈕
            elements.refreshBtn.addEventListener('click', fetchDashboardData);
            elements.retryBtn.addEventListener('click', fetchDashboardData);

            // 主題切換 (Dark / Light)
            elements.themeToggle.addEventListener('click', () => {
                document.documentElement.classList.toggle('dark');
                const isDark = document.documentElement.classList.contains('dark');
                localStorage.setItem('theme', isDark ? 'dark' : 'light');
                if (state.data.length > 0) updateChart();
            });
        }

        // 初始化深色/淺色模式
        function initTheme() {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'light') {
                document.documentElement.classList.remove('dark');
            } else {
                document.documentElement.classList.add('dark');
            }
        }
    </script>
</body>
</html>
